name: automations

# GitHub מתזמן רק לפי UTC, ושעון ישראל זז פעמיים בשנה. לכן הריצה היא כל שעה,
# ושלב ההחלטה בודק מה השעה בישראל ומה צריך לרוץ:
#   סנכרון מודל  07,10,13,16,19,22   מיילים  08,12,16,20   תדריך בוקר  07:23   תזכורות  18:23
# ריצה שמתעכבת (קורה ב-GitHub) מושלמת בשעה או שעתיים אחרי. זה בטוח כי כל הודעה
# נשמרת עם מפתח ייחודי, ולכן ריצה כפולה לא יוצרת הודעה כפולה.
on:
  schedule:
    - cron: "23 3-20 * * *"
  workflow_dispatch:
    inputs:
      which:
        description: "מה להריץ עכשיו"
        type: choice
        options: [1-moodle-sync, 2-email-changes, 3-briefs, 4-reminders, 5-calendar-sync]
        default: 3-briefs
      drill:
        description: "תרגיל כשל: מחליף רק בריצה הזאת את סיסמת Gmail בערך שגוי (הסוד לא משתנה)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: automations
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - id: pick
        env:
          WHICH: ${{ inputs.which }}
          EVENT: ${{ github.event_name }}
          # סנכרון היומן כבוי עד שהוגדר אסימון. בלי זה הוא היה נכשל כל שעה ומציף התראות.
          HAS_GCAL: ${{ secrets.GOOGLE_REFRESH_TOKEN != '' }}
        run: |
          H=$(TZ=Asia/Jerusalem date +%-H)
          list=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            list="$WHICH"
          else
            case "$H" in 7|10|13|16|19|22) list="1-moodle-sync" ;; esac
            case "$H" in 8|12|16|20) list="$list 2-email-changes" ;; esac
            case "$H" in 7|8|9) list="$list 3-briefs" ;; esac
            case "$H" in 18|19|20) list="$list 4-reminders" ;; esac
            if [ "$HAS_GCAL" = "true" ] && [ "$H" -ge 7 ] && [ "$H" -le 22 ]; then list="$list 5-calendar-sync"; fi
          fi
          list=$(echo $list)
          echo "שעה בישראל: $H, להריץ: ${list:-כלום}"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  # כל אוטומציה רצה ב-job משלה ומקבלת רק את הסודות שהיא צריכה. כך ספרייה פגומה
  # (למשל תלות של imapflow) לא רואה את סודות Google, ותדריכים לא רואים את Gmail.
  # כשל ב-job אחד לא עוצר את האחרים, והריצה כולה נכשלת ומתריעה במייל.
  moodle:
    needs: decide
    if: contains(needs.decide.outputs.list, '1-moodle-sync')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: Run 1-moodle-sync
        env:
          TZ: Asia/Jerusalem
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          USER_ID: ${{ secrets.USER_ID }}
          MOODLE_ICS_URL: ${{ secrets.MOODLE_ICS_URL }}
        run: |
          node automations/run-local.js 1-moodle-sync

  email:
    needs: decide
    if: contains(needs.decide.outputs.list, '2-email-changes')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: Install mail libraries
        run: npm install --no-save --no-audit --no-fund imapflow@2.11.0 mailparser@3.14.4
      - name: Run 2-email-changes
        env:
          TZ: Asia/Jerusalem
          EVENT: ${{ github.event_name }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          USER_ID: ${{ secrets.USER_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ inputs.drill && 'drillwrongpass1234' || secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # בענן המייל עדיין לא בהכרח מוגדר: בריצה מתוזמנת בלי סיסמה מדלגים בהודעה, לא בכשל.
          if [ -z "$GMAIL_APP_PASSWORD" ] && [ "$EVENT" = "schedule" ]; then
            echo "::notice::מייל עדיין לא מוגדר (חסר GMAIL_APP_PASSWORD), מדלגת"; exit 0
          fi
          node automations/run-local.js 2-email-changes

  briefs:
    needs: decide
    if: contains(needs.decide.outputs.list, '3-briefs')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: Run 3-briefs
        env:
          TZ: Asia/Jerusalem
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          USER_ID: ${{ secrets.USER_ID }}
        run: |
          node automations/run-local.js 3-briefs

  reminders:
    needs: decide
    if: contains(needs.decide.outputs.list, '4-reminders')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: Run 4-reminders
        env:
          TZ: Asia/Jerusalem
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          USER_ID: ${{ secrets.USER_ID }}
        run: |
          node automations/run-local.js 4-reminders

  calendar:
    needs: decide
    if: contains(needs.decide.outputs.list, '5-calendar-sync')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: Run 5-calendar-sync
        env:
          TZ: Asia/Jerusalem
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          USER_ID: ${{ secrets.USER_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          node automations/run-local.js 5-calendar-sync
