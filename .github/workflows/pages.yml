name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # index.html also loads two files that are git-ignored on purpose: the
      # student's own semester data and the Supabase config. The semester data is
      # always an empty stub (it is personal and never ships). The Supabase config
      # is written from repository variables when they are set, so people can sign
      # in on the published site; the URL and the publishable key are meant for
      # browsers (row-level security protects the data). Never put a service_role
      # key in these variables.
      - name: Write the optional local files
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          : > data/my-semester.js
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf 'window.COPILOT_CONFIG = { supabaseUrl: "%s", supabaseAnonKey: "%s" };\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > js/config.js
            echo "cloud=1" >> "$GITHUB_ENV"
          else
            : > js/config.js
          fi

      # Without a cloud config the site has no data of its own, so send a bare
      # visit to the demo. With one, a bare visit is the real app (sign in).
      - name: Default the published site to the demo
        if: env.cloud != '1'
        run: |
          sed -i 's#</head>#  <script>if(!location.search)location.replace(location.pathname+"?demo=1");</script>\n</head>#' index.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
