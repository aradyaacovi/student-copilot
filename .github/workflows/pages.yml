name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # index.html also loads two files that are git-ignored on purpose: the
      # student's own semester data and the Supabase config. Empty stubs keep the
      # public demo's console clean without shipping anything private.
      - name: Stub the optional local files
        run: |
          : > js/config.js
          : > data/my-semester.js

      # The public site has no data of its own, so send a bare visit to the demo.
      - name: Default the published site to the demo
        run: |
          sed -i 's#</head>#  <script>if(!location.search)location.replace(location.pathname+"?demo=1");</script>\n</head>#' index.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
