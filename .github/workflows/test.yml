name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tests/logic.test.js
      - run: node tests/automations.test.js
        env: { TZ: Asia/Jerusalem }
