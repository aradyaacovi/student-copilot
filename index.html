<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Student Copilot</title>
  <meta name="description" content="מה לעשות עכשיו: תעדוף משימות, לו״ז, מעקב קצב וממוצע לסמסטר">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#121020">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Copilot">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preload" href="fonts/rubik-hebrew.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/rubik-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!--
    Shell: a vertical rail (navigation), the working area, and a focus panel that never leaves.
    The product answers one question – "what now?" – so that answer stays on screen on every tab.
  -->
  <div class="app">
    <aside class="rail">
      <div class="rail-brand">
        <span class="logo" aria-hidden="true">SC</span>
      </div>
      <nav id="tabs" aria-label="ניווט"></nav>
      <div class="rail-foot" id="railFoot"></div>
    </aside>

    <div class="work">
      <header class="top">
        <div>
          <h1 id="pageTitle">היום</h1>
          <div class="sub" id="subtitle"></div>
        </div>
      </header>
      <div id="banner" hidden></div>
      <main id="view"></main>
      <footer class="foot">הנתונים נשמרים בדפדפן הזה, ובענן אם התחברת.</footer>
    </div>

    <section class="focus" id="focus" aria-label="מה עכשיו"></section>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <!-- סדר הטעינה: נתוני הדגמה → הנתונים שלך (אם קיים) → הגדרות ענן (אם קיים) → Supabase → לוגיקה → אפליקציה -->
  <script defer src="data/sample-semester.js"></script>
  <script defer src="data/my-semester.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js" integrity="sha384-A97u3Qnt9GZHURO9YJZRe7VQgGUeFzcv6I1oIGnUTxQrCxnpQMwR0/G8F2zt9abZ" crossorigin="anonymous"></script>
  <script defer src="js/logic.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/pwa.js"></script>
</body>
</html>
